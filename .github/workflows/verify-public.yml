name: Verify public asset catalog
on:
  pull_request:
  push:
    branches: [main, feat/chloe-public-revisions-20261115]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node --test public-release/current-api.test.mjs public-release/catalog.test.mjs public-release/chakhan.test.mjs asset-library/blog-templates/layouts.test.mjs
      - run: node public-release/build.mjs "$RUNNER_TEMP/ai-staff-public-site"
