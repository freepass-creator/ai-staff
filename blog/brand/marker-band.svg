<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
  <!-- 첫 화면 뒤 큰 형광펜 띠. 진짜 형광펜처럼: 끝은 납작한 펜촉 모양으로 비스듬히 «뚝» 끝나고,
       멈춘 자리에 잉크가 살짝 고여 진해지며, 몸통 안엔 결 따라 옅은 줄. 끝으로 갈수록 살짝 마른 느낌(옅어짐) -->
  <defs>
    <linearGradient id="dry" gradientUnits="userSpaceOnUse" x1="830" y1="40" x2="300" y2="930">
      <stop offset="0" stop-color="#F6FD00"/>
      <stop offset=".78" stop-color="#F6FD00"/>
      <stop offset="1" stop-color="#F6FD00" stop-opacity=".82"/>
    </linearGradient>
  </defs>
  <!-- 몸통(가장자리 살짝 울퉁불퉁) -->
  <path fill="url(#dry)" d="M160 930 L178 898 C214 836 252 770 292 702 C338 624 384 546 430 468 C476 390 522 312 568 234 C604 172 640 112 676 52 L700 20 L950 24 L930 60 C896 120 862 180 828 240 C784 318 740 396 696 474 C652 552 608 630 564 708 C530 768 496 828 462 888 L436 934 Z"/>
  <!-- 끝에 고인 잉크(멈춘 자리만 조금 진하게) -->
  <path fill="#E3EA00" opacity=".9" d="M160 930 L436 934 L446 916 L172 912 Z"/>
  <path fill="#E3EA00" opacity=".75" d="M700 20 L950 24 L942 40 L692 36 Z"/>
  <!-- 결: 펜촉 홈 때문에 생기는 옅은 줄 -->
  <g fill="#E8EF00" opacity=".55">
    <path d="M240 926 C380 690 560 380 760 34 L767 36 C567 383 387 693 247 928 Z"/>
    <path d="M318 930 C458 694 638 384 838 36 L844 38 C644 387 464 697 324 931 Z"/>
    <path d="M392 932 C532 696 712 386 906 38 L911 40 C717 389 537 699 397 933 Z"/>
  </g>
  <!-- 끝으로 갈수록 마른 결(아주 옅은 흰 줄 몇 가닥) -->
  <g fill="#FFFFFF" opacity=".35">
    <path d="M276 930 C300 890 324 850 350 806 L354 808 C328 852 304 892 280 931 Z"/>
    <path d="M356 932 C376 898 396 864 418 828 L421 830 C400 866 380 900 360 933 Z"/>
  </g>
</svg>
