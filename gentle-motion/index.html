<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Staff · 다각도 자연 모션</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f4;color:#151c19;font:15px/1.5 system-ui,"Noto Sans KR",sans-serif}.shell{max-width:1060px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;align-items:center;gap:16px}.head h1{font-size:23px;margin:0}.head a{color:#30544a}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:24px;margin-top:22px}.stage{background:white;border:1px solid #dfe6df;border-radius:24px;min-height:560px;display:grid;place-items:center;overflow:hidden;position:relative}.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 85%,#f2f5da 0,transparent 52%)}.actor{width:min(78%,400px);aspect-ratio:2/3;position:relative;transform-origin:50% 82%;will-change:transform;animation:breath 5.8s ease-in-out infinite;transform:translateY(0)}.actor img{width:100%;height:100%;object-fit:contain;position:relative;z-index:1;filter:drop-shadow(0 12px 16px #00000012)}.stage[data-motion="idle"] .actor{animation:breath 5.8s ease-in-out infinite}.stage[data-motion="greet"] .actor{animation:greet 4.8s ease-in-out infinite}.stage[data-motion="present"] .actor{animation:present 6.2s ease-in-out infinite}.stage[data-motion="none"] .actor{animation:none}.stage[data-paused="true"] .actor{animation-play-state:paused}.panel{background:white;border:1px solid #dfe6df;border-radius:20px;padding:22px}.panel h2{font-size:17px;margin:0 0 16px}.group{display:grid;gap:8px;margin:20px 0}label{font-weight:650;font-size:13px}button,select,input{font:inherit}button,select{background:white;border:1px solid #cbd6cc;padding:10px 13px;border-radius:9px;cursor:pointer}button[aria-pressed="true"]{background:#214a3a;color:white;border-color:#214a3a}.buttons{display:flex;gap:7px;flex-wrap:wrap}.hint{font-size:12px;color:#637167;line-height:1.7}.notice{font-size:13px;background:#f4f6f1;padding:12px;border-radius:8px}.tag{font-size:11px;background:#f0f3ed;border-radius:8px;padding:5px 8px}.status{font-size:12px;color:#53635a;min-height:20px}input[type=file]{font-size:12px;max-width:100%}@keyframes breath{0%,100%{transform:translateY(0) scale(1) rotate(0deg)}35%{transform:translateY(-3px) scale(1.004) rotate(.3deg)}65%{transform:translateY(-1px) scale(.998) rotate(-.2deg)}}@keyframes greet{0%,100%{transform:translate(0,0) rotate(0)}20%{transform:translateY(-3px) rotate(-1.6deg)}35%{transform:translateY(-4px) rotate(1.3deg)}55%{transform:translateY(-2px) rotate(-.3deg)}75%{transform:translateY(-1px) rotate(.2deg)}}@keyframes present{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(4px,-3px) rotate(1.1deg)}55%{transform:translate(-3px,-2px) rotate(-.8deg)}75%{transform:translate(1px,-1px) rotate(.2deg)}}@media(max-width:780px){.layout{grid-template-columns:1fr}.stage{min-height:460px}.actor{width:min(70%,320px)}.shell{padding:14px}}@media(prefers-reduced-motion:reduce){.actor{animation:none!important}}</style></head><body><div class="shell"><header class="head"><div><span class="tag">AI STAFF · 2D MOTION</span><h1>다각도 자연 모션</h1></div><a href="../studio/studio/index.html">기존 모션 스튜디오</a></header>
<div class="layout"><section class="stage" id="stage" data-motion="idle" data-paused="false"><div class="actor"><img id="actor" alt="선택한 캐릭터 각도 원본" src="../studio/assets/clo02-thumbs-up-master.webp"></div></section>
<aside class="panel"><h2>원본 그대로, 움직임만 살짝</h2><div class="group"><label>각도</label><div class="buttons"><button data-view="front" aria-pressed="true">앞모습</button><button data-view="side" aria-pressed="false">옆모습</button><button data-view="back" aria-pressed="false">뒷모습</button></div><p class="hint">각도별 이미지는 각각 독립된 원본으로 표시합니다. 없는 각도는 추측해 그리지 않습니다.</p></div><div class="group"><label>동작</label><div class="buttons"><button data-motion="idle" aria-pressed="true">숨쉬기</button><button data-motion="greet" aria-pressed="false">가볍게 인사</button><button data-motion="present" aria-pressed="false">설명하기</button><button data-motion="none" aria-pressed="false">정지</button></div></div><div class="group"><label for="upload">선택한 각도 이미지 불러오기</label><input type="file" id="upload" accept="image/png,image/webp,image/jpeg,image/gif"><p class="hint">파일은 이 브라우저에서만 사용합니다. GitHub에 자동 저장되지 않습니다.</p></div><div class="buttons"><button id="pause">일시정지</button><button id="save">현재 장면 PNG 저장</button></div><p class="status" id="status" role="status">앞모습 원본을 표시하고 있습니다.</p><p class="notice">이 버전은 **원본 이미지 전체**에 몇 픽셀 수준의 미세 움직임만 적용합니다. 팔·다리 관절을 새로 만들어 움직이지 않으며, 실제 공간 회전이나 3D 동작을 구현한 것은 아닙니다.</p></aside></div></div>
<script>
(()=>{'use strict';const views={front:'../studio/assets/clo02-thumbs-up-master.webp',side:null,back:null};const blobs=[];let view='front',paused=false;const img=document.querySelector('#actor'),stage=document.querySelector('#stage'),status=document.querySelector('#status');const setStatus=s=>status.textContent=s;function pressed(attr,value){document.querySelectorAll('button['+attr+']').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset[attr.slice(5)]===value)))}function showView(next){view=next;document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));if(!views[view]){img.style.visibility='hidden';setStatus(({side:'옆모습',back:'뒷모습'})[view]+' 이미지가 연결되지 않았습니다. 아래에서 원본 이미지를 선택해 주세요.');return}img.style.visibility='visible';img.src=views[view];}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));if(views[view]){img.src=views[view];img.style.visibility='visible';status.textContent=view+' 원본을 표시하고 있습니다.'}else{img.style.visibility='hidden';status.textContent='이 각도의 검증된 원본이 미연결입니다. 파일을 선택해 주세요.'}}));
document.querySelectorAll('[data-motion]').forEach(b=>b.addEventListener('click',()=>{stage.dataset.motion=b.dataset.motion;document.querySelectorAll('[data-motion]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));
document.querySelector('#upload').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;if(!['image/png','image/webp','image/jpeg','image/gif'].includes(f.type)){status.textContent='지원하지 않는 이미지입니다.';return}const url=URL.createObjectURL(f);blobs.push(url);views[view]=url;img.src=url;img.style.visibility='visible';status.textContent='선택한 '+view+' 이미지를 브라우저에 불러왔습니다. 저장소에는 업로드되지 않았습니다.'});
document.querySelector('#pause').addEventListener('click',e=>{paused=!paused;stage.dataset.paused=String(paused);e.target.textContent=paused?'재생':'일시정지'});
document.querySelector('#save').addEventListener('click',()=>{if(!views[view]){status.textContent='먼저 원본 이미지를 연결해 주세요.';return}const c=document.createElement('canvas');c.width=1080;c.height=1620;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);const box=img.getBoundingClientRect(),parent=stage.getBoundingClientRect();const s=1620/parent.height;const w=box.width*s,h=box.height*s,cx=(box.left-parent.left)*s,cy=(box.top-parent.top)*s;const tmp=new Image();tmp.onload=()=>{x.drawImage(tmp,cx,cy,w,h);c.toBlob(blob=>{if(!blob)return;const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='ai-staff-'+view+'-still.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)},'image/png')};tmp.onerror=()=>status.textContent='이미지 읽기 실패';tmp.src=img.src});
window.addEventListener('pagehide',()=>blobs.forEach(URL.revokeObjectURL));
})();
</script></body></html>
