<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>클로이 작은 움직임 시험</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f1;color:#21352b;font:16px/1.6 system-ui}main{max-width:1100px;margin:auto;padding:28px}.layout{display:grid;grid-template-columns:1fr 350px;gap:28px}h1{font-size:30px;margin:12px 0}a{color:#315c42}.stage{background:white;border:1px solid #dce5da;border-radius:18px;overflow:hidden;text-align:center}canvas{display:block;width:100%;height:auto;max-height:820px;object-fit:contain}aside{background:white;border-radius:16px;padding:24px;align-self:start}label{display:block;margin:20px 0}input[type=range]{width:100%}button{font:inherit;padding:10px 18px;border:1px solid #bdd0be;border-radius:9px;background:#eaf4e4;color:#21352b;cursor:pointer}small{display:block;color:#647566}video{width:100%;margin-top:18px;border-radius:12px}#status{font-size:14px;color:#607061}@media(max-width:760px){.layout{grid-template-columns:1fr}canvas{max-height:70vh}}</style><main><nav><a href="/characters/">클로이 정본</a> · <a href="/library/">장면 라이브러리</a></nav><h1>클로이, 가볍게 움직여보기</h1><p>살짝 흔들리는 몸과 화면 속 눈 깜박임의 준비 상태를 확인합니다.</p><div class="layout"><section class="stage"><canvas id="chloe" width="640" height="960" aria-label="살랑이며 눈을 깜박이는 클로이"></canvas></section><aside><h2>작은 움직임</h2><label><input type="checkbox" id="body" checked> 몸 살랑임</label><label><input type="checkbox" id="eyes"> 눈 깜박임 기술시험</label><label>움직임 크기<input type="range" id="strength" min="0" max="1" step="0.05" value="0.65"></label><button id="pause" type="button">잠시 멈춤</button><p id="status">현재 이미지를 확인하고 있습니다…</p><small>현재 장면 라이브러리의 인사 포즈로 만든 시험입니다. 눈 깜박임은 검은 화면의 반사 경계가 남는 기술시험입니다. 손·손가락 접기 동작은 아직 포함하지 않았습니다.</small><video controls playsinline muted loop preload="metadata" src="./preview.mp4" aria-label="클로이 살랑임 6초 영상"></video><a href="./preview.mp4" download>6초 영상 내려받기</a></aside></div></main><script type="module" src="./app.js"></script></html>
